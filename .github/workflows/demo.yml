name: harlie-demo

on:
  workflow_dispatch:

jobs:
  # Step 1: Inspect the environment
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Show workspace
        run: ls -la
      - name: System info
        run: uname -a && date

  # Step 2: Run the build (Starts only after 'inspect' finishes successfully)
  build:
    needs: inspect
    runs-on: ubuntu-latest
    steps:
      - name: Build artifact
        run: echo "hello from harlie" > hello.txt
